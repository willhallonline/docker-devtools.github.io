title: Docker DevTools
description: >-
  Docker DevTools provides a set of shell aliases that run common developer
  tools (linters, formatters, package managers) inside Docker containers —
  no local language runtimes required.
tagline: Run your favourite dev tools in Docker. No local installs required.

theme: just-the-docs

url: "https://willhallonline.github.io"
baseurl: "/docker-devtools.github.io"

repository: willhallonline/docker-devtools-aliases
aliases_repo: willhallonline/docker-devtools-aliases

# Aux links shown in the top bar
aux_links:
  "Docker DevTools Aliases on GitHub":
    - "https://github.com/willhallonline/docker-devtools-aliases"
aux_links_new_tab: true

nav_external_links:
  - title: Docker DevTools Aliases repo
    url: https://github.com/willhallonline/docker-devtools-aliases
    hide_icon: false

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Copyright &copy; 2017-2026 Will Hall. Distributed under an MIT license."

last_edit_timestamp: true
last_edit_time_format: "%b %e, %Y"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/willhallonline/docker-devtools.github.io"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

color_scheme: light

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
